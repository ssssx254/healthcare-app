# Render Blueprint — https://render.com/docs/blueprint-spec
# Dashboard → New → Blueprint → энэ файлыг сонгоно

services:
  - type: web
    name: healthcare-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    # Production MySQL (DATABASE_URL) дээр lab_tests гэх мэт шинэ хүснэгтүүдийг idempotent migration-аар үүсгэнэ
    startCommand: npm run db:migrate:deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
        # Жишээ: https://your-app.web.app,https://your-app.firebaseapp.com
